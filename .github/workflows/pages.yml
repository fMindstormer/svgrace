name: pages
# The live page, https://fmindstormer.github.io/svgrace/: examples/index.html embeds the clocked
# examples/maze.svg with <object>, which event-based timing needs. Both are committed, and checks.yml
# fails if examples/build.py would write them differently.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp examples/index.html examples/maze.svg _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
